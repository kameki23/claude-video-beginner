<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Claude ではじめる動画づくり入門</title>
<style>
:root{--bg:#F1F2F4;--card:#fff;--ink:#16181D;--mute:#5B606C;--line:#D8DBE1;--rec:#D93A26}
@media (prefers-color-scheme:dark){:root{--bg:#101216;--card:#181B21;--ink:#E8EAEE;--mute:#9AA0AC;--line:#2B2F38;--rec:#FF5A43}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:16px;box-sizing:border-box}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:380px;display:grid;gap:14px}
h1{font-size:22px;margin:0}p{margin:0;color:var(--mute);font-size:14px;line-height:1.7}
input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:700;font-size:16px;padding:10px;border:0;border-radius:8px;background:var(--rec);color:#fff;cursor:pointer}
button:disabled{opacity:.6}#msg{min-height:1.4em;color:var(--rec);font-size:14px}
</style></head><body>
<form id="f"><h1>Claude ではじめる動画づくり入門</h1><p>このページはパスワードで保護されています。</p>
<label for="pw" style="font-size:14px">パスワード</label>
<input id="pw" type="password" autocomplete="current-password" required autofocus>
<button id="b" type="submit">開く</button><div id="msg" aria-live="polite"></div></form>
<script>
var P={"salt": "lTHLQCKhxrgto/CUBNd2yw==", "iv": "0toSEnDH253RFULu", "iter": 600000};
function d(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
document.getElementById('f').addEventListener('submit',async function(ev){
  ev.preventDefault();var b=document.getElementById('b'),m=document.getElementById('msg');
  b.disabled=true;m.textContent='確認しています…';
  try{
    var raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(P.salt),iterations:P.iter,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);
    m.textContent='読み込んでいます…';
    var buf=await (await fetch('content.enc')).arrayBuffer();
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.iv)},key,buf);
    var html=new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
  }catch(e){m.textContent='パスワードが違います';b.disabled=false}
});
</script></body></html>
